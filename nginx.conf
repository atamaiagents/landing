server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (better settings)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Static assets: 1 year immutable (Next.js hashes filenames)
    location ~* ^/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Other static assets: 30 days
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary "Accept-Encoding";
    }

    # HTML: allow Cloudflare to cache for 5 minutes, revalidate after
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60";
    }

    # Root / index: same short cache for Cloudflare edge
    location = / {
        expires 5m;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60";
        try_files /index.html =404;
    }

    # SPA routing: fallback to index.html for unknown paths
    location / {
        expires 5m;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60";
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
